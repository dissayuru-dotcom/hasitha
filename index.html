<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Priyangika &amp; Hasitha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: one long centred scroll. Hero with falling petals, framed photo, rotating blessings, live "married since" clock. */
:root{
  --bg:#0d241d; --bg2:#14352a; --ivory:#f7f0e4; --rose:#eab8b8; --gold:#d4af68; --mist:#b7c8bc;
  --f-script:'Pinyon Script','Snell Roundhand','Brush Script MT',cursive;
  --f-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-body:'Jost','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ivory); font-family:var(--f-body); font-weight:300;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden; position:relative;
  background-image:
    radial-gradient(60rem 40rem at 50% -10%, rgba(212,175,104,.16), transparent 60%),
    radial-gradient(40rem 30rem at 100% 40%, rgba(234,184,184,.08), transparent 60%),
    radial-gradient(40rem 30rem at 0% 75%, rgba(120,190,150,.10), transparent 60%);
}
#root{max-width:720px;margin:0 auto;position:relative;z-index:2}
section{padding-block:clamp(40px,8vw,72px);text-align:center}
h1,h2,p,figure{margin:0}
.eyebrow{font-family:var(--f-body);font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);font-weight:400}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.9rem,6vw,2.6rem);text-wrap:balance;line-height:1.15}

/* petals */
.petals{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.petal{position:absolute;top:-8vh;width:var(--s);height:calc(var(--s)*1.3);
  background:linear-gradient(135deg,#f6d3d3,#e29aa8);border-radius:150% 0 150% 0;opacity:.8;
  animation:fall var(--d) linear var(--dl) infinite, sway var(--sw) ease-in-out var(--dl) infinite alternate}
@keyframes fall{to{top:108vh}}
@keyframes sway{from{transform:translateX(-30px) rotate(-30deg)}to{transform:translateX(40px) rotate(150deg)}}

/* hero */
.hero{padding-top:clamp(36px,9vw,80px)}
.rings{width:110px;height:64px;margin:0 auto 14px;display:block}
.rings circle{fill:none;stroke:var(--gold);stroke-width:2.4;stroke-dasharray:140;stroke-dashoffset:140;animation:draw 2.4s ease forwards}
.rings circle+circle{animation-delay:.7s}
@keyframes draw{to{stroke-dashoffset:0}}
.names{display:flex;flex-direction:column;align-items:center;gap:0;margin:18px 0 8px}
.name{font-family:var(--f-script);font-size:clamp(3.4rem,15vw,6.2rem);line-height:1.05;color:var(--ivory);
  text-shadow:0 0 30px rgba(212,175,104,.35);opacity:0;transform:translateY(24px);animation:rise 1.4s ease forwards}
.amp{font-family:var(--f-display);font-style:italic;font-size:clamp(1.6rem,6vw,2.4rem);color:var(--rose);
  opacity:0;animation:fade 1.2s ease 1.1s forwards}
.name.b{animation-delay:1.6s}
.name.a{animation-delay:.5s}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
.date{font-family:var(--f-display);font-size:clamp(1.15rem,4vw,1.5rem);letter-spacing:.12em;margin-top:18px;opacity:0;animation:fade 1.2s ease 2.3s forwards}
.date::before,.date::after{content:"";display:inline-block;width:34px;height:1px;background:var(--gold);vertical-align:middle;margin:0 14px}
.tagline{font-family:var(--f-display);font-style:italic;font-size:clamp(1.15rem,4.2vw,1.45rem);color:var(--mist);margin:22px auto 0;max-width:30ch;text-wrap:balance;opacity:0;animation:fade 1.2s ease 2.8s forwards}

/* photo */
.frame-wrap{position:relative;display:inline-block;max-width:min(100%,420px);animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-10px) rotate(1deg)}}
.frame{background:var(--ivory);padding:12px 12px 52px;border-radius:3px;box-shadow:0 30px 60px rgba(0,0,0,.5),0 0 0 1px rgba(212,175,104,.5);position:relative}
.frame img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;background:#222}
.frame figcaption{position:absolute;left:0;right:0;bottom:12px;font-family:var(--f-script);font-size:1.7rem;color:#3a2a2a}
.tape{position:absolute;top:-14px;left:50%;width:110px;height:28px;margin-left:-55px;background:rgba(212,175,104,.55);transform:rotate(-3deg);backdrop-filter:blur(2px)}
.spark{position:absolute;width:14px;height:14px;background:var(--gold);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0);opacity:.2}50%{transform:scale(1.2) rotate(90deg);opacity:1}}

/* wish */
.wish-lead{font-family:var(--f-script);font-size:clamp(2.2rem,8vw,3.2rem);color:var(--rose);margin-bottom:10px}
.wish-body{font-family:var(--f-display);font-size:clamp(1.2rem,4.3vw,1.55rem);line-height:1.55;max-width:34ch;margin:14px auto 0;text-wrap:balance}
.card{margin:30px auto 0;max-width:520px;min-height:190px;padding:34px 26px;border:1px solid rgba(212,175,104,.45);border-radius:2px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));position:relative;display:flex;align-items:center;justify-content:center}
.card::before,.card::after{content:"";position:absolute;width:22px;height:22px;border:1px solid var(--gold)}
.card::before{top:7px;left:7px;border-right:0;border-bottom:0}
.card::after{bottom:7px;right:7px;border-left:0;border-top:0}
.quote{font-family:var(--f-display);font-style:italic;font-size:clamp(1.25rem,4.4vw,1.6rem);line-height:1.45;text-wrap:balance;animation:quote .9s ease both}
@keyframes quote{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.dots{display:flex;gap:10px;justify-content:center;margin-top:18px}
.dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold);background:transparent;padding:0;cursor:pointer;transition:background .3s,transform .3s}
.dot[aria-current="true"]{background:var(--gold);transform:scale(1.3)}
.dot:focus-visible,.btn:focus-visible{outline:2px solid var(--rose);outline-offset:3px}

/* clock */
.clock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:460px;margin:26px auto 0}
.unit{padding:16px 4px 12px;border-top:1px solid var(--gold);border-bottom:1px solid rgba(212,175,104,.25)}
.num{display:block;font-family:var(--f-display);font-size:clamp(1.9rem,8vw,2.8rem);font-variant-numeric:tabular-nums;line-height:1}
.lbl{display:block;margin-top:8px;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mist)}

/* blessing button */
.btn{position:relative;font-family:var(--f-body);font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;font-weight:400;color:var(--bg);background:linear-gradient(120deg,#e6c47f,#d4af68 50%,#e9cf93);border:0;padding:16px 34px;cursor:pointer;border-radius:999px;box-shadow:0 10px 30px rgba(212,175,104,.3);transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 16px 36px rgba(212,175,104,.45)}
.btn:active{transform:scale(.97)}
.count{margin-top:16px;font-family:var(--f-display);font-style:italic;color:var(--mist);min-height:1.5em}
.heart{position:absolute;left:50%;top:50%;pointer-events:none;font-size:var(--hs);color:var(--rose);animation:hfly 1.9s ease-out forwards;z-index:5}
@keyframes hfly{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--hx)),calc(-50% - var(--hy))) scale(1.1) rotate(var(--hr));opacity:0}}
.heart-wrap{position:relative;display:inline-block}

footer{padding-block:60px 70px;text-align:center}
.sign{font-family:var(--f-script);font-size:clamp(2.2rem,8vw,3.4rem);color:var(--ivory)}
.small{font-family:var(--f-display);font-style:italic;color:var(--mist);margin-top:12px;font-size:1.15rem}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition:none!important}
  .petals{display:none}
  .name,.amp,.date,.tagline{opacity:1;transform:none}
}
</style>
